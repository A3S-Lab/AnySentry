services:
  a3s-code-agent:
    image: ${AGENT_LAB_IMAGE:-anysentry-agent-runtime-lab:0.1.0}
    build:
      context: .
    container_name: anysentry-test-a3s-code
    restart: unless-stopped
    environment:
      AGENT_RUNTIME: a3s-loop
      AGENT_ID: docker-a3s-code-loop
      AGENT_INTERVAL_SECONDS: ${A3S_INTERVAL_SECONDS:-20}
    labels:
      anysentry.io/workload-kind: agent
      anysentry.io/agent-id: docker-a3s-code-loop
      anysentry.io/agent-runtime: a3s-code
    volumes:
      - a3s-workspace:/workspace

  pi-agent:
    image: ${AGENT_LAB_IMAGE:-anysentry-agent-runtime-lab:0.1.0}
    build:
      context: .
    container_name: anysentry-test-pi
    restart: unless-stopped
    environment:
      AGENT_RUNTIME: pi
      AGENT_ID: docker-pi-agent
      AGENT_INTERVAL_SECONDS: ${PI_INTERVAL_SECONDS:-60}
      PI_EXECUTION_MODE: ${PI_EXECUTION_MODE:-auto}
      PI_PROVIDER: ${PI_PROVIDER:-}
      PI_MODEL: ${PI_MODEL:-}
      PI_THINKING: ${PI_THINKING:-low}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    labels:
      anysentry.io/workload-kind: agent
      anysentry.io/agent-id: docker-pi-agent
      anysentry.io/agent-runtime: pi
    volumes:
      - pi-workspace:/workspace
      - pi-state:/home/node/.pi/agent

  docker-observer:
    profiles: [observe]
    image: ${ANYSENTRY_OBSERVER_IMAGE:-127.0.0.1:5000/anysentry-observer:agent-runtime-lab}
    container_name: anysentry-agent-lab-observer
    restart: unless-stopped
    privileged: true
    pid: host
    entrypoint: ["/bin/sh", "-c"]
    command: ["a3s-observer-collector | node /opt/observer-forward.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      A3S_OBSERVER_JSON: "1"
      A3S_OBSERVER_COLLECTOR_ID: agent-runtime-lab-docker-native-20260802
      A3S_NODE_NAME: agent-runtime-lab-docker-host
      ANYSENTRY_INGEST_URL: ${ANYSENTRY_DOCKER_INGEST_URL:-http://host.docker.internal:29653/security-center/ingest}
      ANYSENTRY_BATCH_INGEST_URL: ${ANYSENTRY_DOCKER_BATCH_INGEST_URL:-http://host.docker.internal:29653/security-center/ingest/batch}
      ANYSENTRY_IDENTITY_SNAPSHOT_URL: ${ANYSENTRY_DOCKER_IDENTITY_URL:-http://host.docker.internal:29653/security-center/identity/snapshot}
      ANYSENTRY_SOURCE_TYPE: observer
      ANYSENTRY_SOURCE_NAME: agent-runtime-lab-docker-native-observer
      ANYSENTRY_HEARTBEAT_SECS: "5"
      ANYSENTRY_IDENTITY_SNAPSHOT_SECS: "5"
      ANYSENTRY_DOCKER_DISCOVERY: "on"
      FORWARD_FILTER_MODE: enforce
      FORWARD_RETAIN_UNKNOWN: "false"
      FORWARD_RETAIN_NON_AGENT: "false"
      FORWARD_NOISE_POLICY: balanced
    volumes:
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Keep the lab on the current checkout even when Docker's image builder
      # is unavailable or an older observer image is already cached locally.
      - ../../scripts/observer-forward.js:/opt/observer-forward.js:ro
      - ../../scripts/observer-agent-attribution.js:/opt/observer-agent-attribution.js:ro
      - ../../scripts/observer-attribution-merge.js:/opt/observer-attribution-merge.js:ro
      - ../../scripts/observer-agent-runtime-signatures.js:/opt/observer-agent-runtime-signatures.js:ro
      - ../../scripts/observer-agent-templates.js:/opt/observer-agent-templates.js:ro
      - ../../scripts/observer-docker-discovery.js:/opt/observer-docker-discovery.js:ro
      - ../../scripts/observer-behavior-discovery.js:/opt/observer-behavior-discovery.js:ro
      - ../../scripts/observer-priority-queue.js:/opt/observer-priority-queue.js:ro
      - ../../scripts/observer-event-dedup.js:/opt/observer-event-dedup.js:ro
      - ../../scripts/observer-workload-filter.js:/opt/observer-workload-filter.js:ro
      - ../../scripts/observer-infrastructure-roots.js:/opt/observer-infrastructure-roots.js:ro

volumes:
  a3s-workspace:
  pi-workspace:
  pi-state:
