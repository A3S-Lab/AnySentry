apiVersion: v1
kind: Secret
metadata:
  name: pi-agent-credentials
  namespace: anysentry-agent-test
type: Opaque
stringData:
  # Choose one provider/key pair and set a tool-capable model.
  PI_PROVIDER: openai
  PI_MODEL: gpt-4o
  OPENAI_API_KEY: replace-me
  # Create a token-protected Source with correlation authority `agent_adapter` first.
  ANYSENTRY_PI_ADAPTER_URL: http://anysentry.anysentry.svc.cluster.local:29653/security-center/ingest/events
  ANYSENTRY_ADAPTER_SOURCE_ID: replace-with-managed-source-id
  ANYSENTRY_ADAPTER_TOKEN: replace-with-managed-source-token
  ANYSENTRY_TENANT_ID: default
  ANYSENTRY_ENVIRONMENT_ID: k8s-agent-lab
  ANYSENTRY_WORKSPACE_PATH: /workspace
  ANYSENTRY_AGENT_SCOPE_ID: k8s-pi-agent
  # Optional for an OpenAI-compatible endpoint:
  # OPENAI_BASE_URL: https://api.example.com/v1
