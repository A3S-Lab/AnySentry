apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anysentry-pod-reader
  namespace: anysentry-agent-test
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anysentry-pod-reader
  namespace: anysentry-agent-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: anysentry-pod-reader
subjects:
  - kind: ServiceAccount
    name: anysentry
    namespace: anysentry
