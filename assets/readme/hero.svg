      <rect x="443" y="268" width="171" height="36" rx="8" fill="#231619" stroke="#71333E"/>
      <text x="459" y="291" fill="#FDA4AF">EVIDENCE BUNDLES</text>
    </g>

    <text x="58" y="382" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">eBPF observer · JSON · CloudEvents · OTLP · agent-native API</text>
  </g>

  <g transform="translate(674 34)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect width="470" height="350" rx="18" fill="#111612" stroke="#2A3730"/>
    <circle cx="24" cy="25" r="5" fill="#2DD4BF"/>
