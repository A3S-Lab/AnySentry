<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AnySentry — AI agent runtime evidence and intervention</title>
  <desc id="desc">A runtime event moves through observation, normalization, tiered judgment, and an evidence-linked approval action.</desc>

  <rect width="1200" height="420" rx="24" fill="#0B0F0C"/>
  <path d="M0 356H1200" stroke="#223029"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="58" y="56" fill="#2DD4BF" font-size="17" font-weight="700" letter-spacing="2.2">AI AGENT SECURITY · RUNTIME EVIDENCE PLANE</text>
    <text x="56" y="137" fill="#F8FAFC" font-size="68" font-weight="750" letter-spacing="-2">AnySentry</text>
    <text x="58" y="190" fill="#CBD5E1" font-size="27" font-weight="500">Observe what agents actually do.</text>
    <text x="58" y="229" fill="#CBD5E1" font-size="27" font-weight="500">Judge risk. Turn evidence into action.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="650">
      <rect x="58" y="268" width="181" height="36" rx="8" fill="#0E2420" stroke="#1A6A5E"/>
