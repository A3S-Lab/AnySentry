    <text x="43" y="106" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">curl 169.254.169.254/latest/meta-data</text>

    <path d="M49 123V308" stroke="#38524A" stroke-width="2"/>
    <path d="M49 308L41 296M49 308L57 296" stroke="#38524A" stroke-width="2" fill="none"/>

    <g>
      <circle cx="49" cy="157" r="8" fill="#0B0F0C" stroke="#2DD4BF" stroke-width="3"/>
      <text x="76" y="154" fill="#F8FAFC" font-size="20" font-weight="700">Observe</text>
