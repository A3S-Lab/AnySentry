      <text x="185" y="213" fill="#94A3B8" font-size="18">identity · redaction</text>
      <text x="76" y="234" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">anysentry.agent_event.v1</text>
