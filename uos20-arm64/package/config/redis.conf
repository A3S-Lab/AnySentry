bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
logfile ""
databases 16
dir /var/lib/anysentry/redis
# The verified UOS 4.19 ARM64 kernel fails Redis' MADV_FREE+fork
# dirty-page self-test. Redis is used only as a rebuildable BullMQ broker;
# security events and decisions remain durable in ClickHouse. Disable all
# fork-based persistence before acknowledging the kernel warning.
ignore-warnings ARM64-COW-BUG
save ""
appendonly no
