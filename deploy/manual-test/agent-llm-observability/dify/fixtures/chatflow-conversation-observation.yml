app:
  description: Deterministic Chatflow conversation fixture for multi-turn observation.
  icon: "💬"
  icon_background: '#E8F5FF'
  mode: advanced-chat
  name: AnySentry Dify Chatflow Conversation Observation
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.64@ed082da9060cdaf69127de0f39e7ba5d255d74276feed9c88b2ba5226515728c
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: llm
        id: start-to-llm
        source: start_node
        sourceHandle: source
        target: llm_node
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: answer
        id: llm-to-answer
        source: llm_node
        sourceHandle: source
        target: answer_node
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: Dify supplies sys.query from each chat message.
          selected: false
          title: Start
          type: start
          variables: []
        height: 90
        id: start_node
        position:
          x: 30
          y: 227
        positionAbsolute:
          x: 30
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: The memory window is enabled so the same conversation can be observed across turns.
          memory:
            query_prompt_template: '{{#sys.query#}}'
            role_prefix:
              assistant: ''
              user: ''
            window:
              enabled: true
              size: 10
          model:
            completion_params:
              temperature: 0
            mode: chat
            name: anysentry-observation-model
            provider: langgenius/openai_api_compatible/openai_api_compatible
          prompt_template:
            - id: chatflow-system-prompt-v1
              role: system
              text: |-
                ANYSENTRY_DIFY_CHATFLOW_SYSTEM_V1
                Answer concisely and preserve the chatflow marker.
            - id: chatflow-user-prompt-v1
              role: user
              text: |-
                CHATFLOW_QUERY={{#sys.query#}}
          retry_config:
            enabled: false
            exponential_backoff:
              enabled: false
              max_interval: 10000
              multiplier: 2
            max_retries: 1
            retry_interval: 1000
          selected: false
          structured_output:
            enabled: false
          title: Chatflow LLM Call
          type: llm
          variables: []
          vision:
            enabled: false
        height: 110
        id: llm_node
        position:
          x: 334
          y: 227
        positionAbsolute:
          x: 334
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          answer: '{{#llm_node.text#}}'
          desc: The visible answer is the LLM output, not an inferred local value.
          selected: false
          title: Answer
          type: answer
          variables: []
        height: 90
        id: answer_node
        position:
          x: 638
          y: 227
        positionAbsolute:
          x: 638
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
