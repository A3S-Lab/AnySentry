apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: a3s-observer
  namespace: anysentry
spec:
  template:
    metadata:
      annotations:
        anysentry.io/manual-observer-profile: "agent-enforce-docker-files-v4-bounded-lifecycle-20260907"
        # Keep the locally delivered immutable overlay and source checkpoints auditable in the
        # rendered PodTemplate; this is not a remote publication identifier.
        anysentry.io/local-overlay-manifest: "sha256:c9eb1f88f15465fc88d68c4392a36f3ea513f3f0968dbce99e2dc92fc05c8b23"
        anysentry.io/local-source-revision: "Observer@705e9c1+bounded-unknown-lifecycle+AnySentry@141e244"
    spec:
      containers:
        - name: a3s-observer
          env:
            # The manual test is deterministic: Kubernetes/Docker workload metadata and exact
            # runtime signatures identify Agents. Background behavior promotion is intentionally
            # disabled so unrelated host churn cannot become an unbounded ingest source.
            - { name: ANYSENTRY_BEHAVIOR_DISCOVERY, value: "off" }
            - { name: FORWARD_FILTER_MODE, value: "enforce" }
            # Keep all three rollout planes explicit in the reproducible manual profile. The
            # canonical base is deliberately shadow-safe, so omitting either override here would
            # silently regress S3 production or Ring-before enforcement on a later re-apply.
            - { name: ANYSENTRY_UNKNOWN_RETENTION_MODE, value: "enforce" }
            - { name: ANYSENTRY_CAPTURE_PROFILE_MODE, value: "enforce" }
            # Ring-before Agent/Candidate FULL with bounded unknown Exec/Exit/LLM discovery.
            # Set to 0 to restore legacy protected=always-FULL lifecycle behavior.
            - { name: A3S_OBSERVER_BOUNDED_UNKNOWN_LIFECYCLE, value: "1" }
            # Unknown remains discoverable; only its high-volume FileAccess lane is budgeted.
            - { name: FORWARD_RETAIN_UNKNOWN, value: "false" }
            - { name: FORWARD_RETAIN_NON_AGENT, value: "false" }
            # File probes are enabled independently. Their unknown/non-Agent path is dropped
            # before path copy/Ring reservation, while Agent/candidate matches use the bounded
            # per-scope/node sample budget in the Collector. FileRead must remain explicit.
            - { name: A3S_OBSERVER_FILES, value: "1" }
            - { name: A3S_OBSERVER_FILE_ACCESS, value: "1" }
            - { name: A3S_OBSERVER_FILE_DELETE, value: "1" }
            # FileRead is an explicit high-volume probe. Keep it off for the
            # default/access canary; enable it only via k8s-observer-files-full.
            - { name: A3S_OBSERVER_FILE_READ, value: "0" }
            - { name: A3S_OBSERVER_FILE_UNKNOWN_POLICY, value: "drop" }
            # Discovery budget for unknown Exec/LLM after bounded-lifecycle remap. Keep this far
            # below the historical unprotected FULL flood while still allowing first-seen Agent
            # promotion evidence. Shared across non-protected probes per sample window.
            - { name: ANYSENTRY_CAPTURE_SAMPLE_PER_SCOPE, value: "3" }
            - { name: ANYSENTRY_CAPTURE_SAMPLE_PER_NODE, value: "30" }
            - { name: ANYSENTRY_CAPTURE_FIRST_SAMPLES, value: "2" }
            - { name: ANYSENTRY_CAPTURE_SAMPLE_WINDOW_MS, value: "1000" }
            # Exec/Exit are correctness-critical and share one bounded lane. The host can emit
            # short process bursts while CLI agents fan out helpers; size this lane for bursts so
            # a slow downstream write cannot turn ordinary lifecycle evidence into an inbox drop.
            - { name: A3S_OBSERVER_CRITICAL_INBOX_CAPACITY, value: "131072" }
            - { name: A3S_OBSERVER_SEMANTIC_INBOX_CAPACITY, value: "65536" }
            - { name: A3S_OBSERVER_SSL, value: "1" }
            # This single host also runs the retained Docker Pi workload. Reuse the same Observer
            # and enrich its eBPF events from the Docker lifecycle/inspect stream.
            - { name: ANYSENTRY_DOCKER_DISCOVERY, value: "on" }
            - { name: ANYSENTRY_DOCKER_SOCKET, value: "/var/run/docker.sock" }
            # The API now persists each immutable Observer batch as one ClickHouse block. Retain
            # the canonical 32-event batch so protected Exec/Exit traffic can drain faster than the
            # node emits it; byte, ownership, retry-age, and protected-reserve bounds remain hard.
            - { name: FORWARD_BATCH_SIZE, value: "128" }
            - { name: FORWARD_HTTP_TIMEOUT_MS, value: "30000" }
            - { name: ANYSENTRY_BATCH_INGEST_URL, value: "http://anysentry:29653/security-center/ingest/batch" }
            # Keep the historical WAL files intact, but do not replay a multi-GB backlog into the
            # already busy single-node ClickHouse during this controlled observation window. A
            # fresh bounded journal is created by the Forwarder; old journals remain recoverable
            # artifacts and are never deleted or truncated by deployment.
            - { name: FORWARD_MAX_INFLIGHT, value: "8" }
            - { name: FORWARD_SPOOL_PATH, value: "/var/lib/anysentry-forwarder/spool-stable-20260907.wal" }
            - { name: FORWARD_SPOOL_MAX_RECORDS, value: "250000" }
            - { name: FORWARD_SPOOL_MAX_BYTES, value: "536870912" }
            - { name: FORWARD_SPOOL_MAX_WAL_BYTES, value: "1073741824" }
            - { name: FORWARD_SPOOL_REPLAY_BATCH_SIZE, value: "128" }
            - { name: FORWARD_SPOOL_REPLAY_INTERVAL_MS, value: "1000" }
          volumeMounts:
            - { name: docker-sock, mountPath: /var/run/docker.sock, readOnly: true }
      volumes:
        - { name: docker-sock, hostPath: { path: /var/run/docker.sock, type: Socket } }
