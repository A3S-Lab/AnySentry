apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This overlay leaves the production-oriented canonical file unchanged, but deliberately renders
# its manual-test DaemonSet in enforce mode with behavior promotion disabled. Render it with
# --load-restrictor=LoadRestrictionsNone because the base lives above this manual-test directory,
# then pipe the result to client-side `kubectl apply`.
resources:
  - ../../observer.yaml

images:
  - name: ghcr.io/a3s-lab/anysentry-observer
    newName: 127.0.0.1:5000/anysentry-observer
    digest: sha256:644ed8f14cbe32310dda69b72f60b8f5a67cc2e6e6bca9b1c23b502754d53dc2

patches:
  - path: observer-manual-patch.yaml
  - path: rules-version2-patch.yaml
