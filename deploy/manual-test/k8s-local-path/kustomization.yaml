apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Single-node manual-test overlay. The canonical Flink manifest intentionally remains RWX for
# production clusters; only this overlay binds checkpoints to k3s local-path/RWO.
resources:
  - ../../anysentry.yaml
  - ../../streaming.yaml

images:
  - name: ghcr.io/a3s-lab/anysentry
    newName: 127.0.0.1:5000/anysentry
    digest: sha256:f656891201648776371d4d8b5e20261f74ba7c22641d45571db8e984c6813072
  - name: ghcr.io/a3s-lab/anysentry-flink-streaming
    newName: 127.0.0.1:5000/anysentry-flink-streaming
    digest: sha256:bcce599325a53132a0e4495717878bcab53cbfc7724813ab83e6961ab934398c

patches:
  - path: ../runtime-on.yaml
  - path: flink-checkpoints-rwo.yaml
