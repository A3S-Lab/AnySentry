apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Single-node full-function overlay. It keeps canonical production manifests unchanged while
# binding checkpoints and Postgres to local-path, adding the read-only local Workspace Scanner,
# and preserving the manual NodePort contract.
resources:
  - ../../anysentry.yaml
  - ../../streaming.yaml
  - manual-support.yaml
  - service-context-probe.yaml

images:
  - name: ghcr.io/a3s-lab/anysentry
    newName: 127.0.0.1:5000/anysentry
    digest: sha256:2a7e0c6c4447dfda95bff2b305c4b4ad3e0bbb0ca07b535e8545223bef5b5349
  - name: ghcr.io/a3s-lab/anysentry-flink-streaming
    newName: 127.0.0.1:5000/anysentry-flink-streaming
    digest: sha256:c7c78c92399cad11868ee3c022bdd3cafd17da1c8a8ff1ea501f02957b3c580a
  - name: ghcr.io/a3s-lab/anysentry-workspace-scanner
    newName: 127.0.0.1:5000/anysentry-workspace-scanner
    digest: sha256:6d70223604cad8ee030a1e7eec90385b7c854f0829977dd4565d0a91fb223799
  - name: 127.0.0.1:5000/anysentry-context-probe
    newName: 127.0.0.1:5000/anysentry-context-probe
    digest: sha256:362c26fc8c2bc50a711815ef5111db48edbd349829b2fc1776c280e5667a2c58

patches:
  - path: ../runtime-on.yaml
  - path: flink-checkpoints-rwo.yaml
  - path: anysentry-nodeport-patch.yaml
  - path: full-load-capacity-patch.yaml
