apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staged core rollout used before the local-path streaming plane. The runtime patch enables every
# feature flag now, while unavailable Kafka/Flink dependencies remain health-visible and recover
# automatically when the second stage is applied.
resources:
  - ../../anysentry.yaml

images:
  - name: ghcr.io/a3s-lab/anysentry
    newName: 127.0.0.1:5000/anysentry
    digest: sha256:41a079ff00327019bbd3207095b75770ba341526f7cb040dc341b7dea084c2ee

patches:
  - path: ../runtime-on.yaml
