apiVersion: v1
kind: Namespace
metadata:
  name: anysentry-agent-test
  labels:
    anysentry.io/test-environment: manual-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-coding-agent
  namespace: anysentry-agent-test
  labels:
    app.kubernetes.io/name: pi-coding-agent
    app.kubernetes.io/part-of: anysentry-manual-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-coding-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-coding-agent
        app.kubernetes.io/part-of: anysentry-manual-test
        anysentry.io/workload-kind: agent
        anysentry.io/agent-id: k8s-pi-agent-manual
        anysentry.io/agent-container: agent
        anysentry.io/agent-runtime: pi
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          # apply-pi-agent-k8s.sh requires and injects an immutable digest here.
          image: __ANYSENTRY_AGENT_LAB_IMAGE__
          imagePullPolicy: IfNotPresent
          stdin: true
          tty: true
          env:
            - { name: AGENT_RUNTIME, value: pi }
            - { name: AGENT_ID, value: k8s-pi-agent-manual }
            - { name: AGENT_INTERVAL_SECONDS, value: "60" }
            # RPC waits for input and never submits a model turn on its own.
            - { name: PI_EXECUTION_MODE, value: rpc }
            - { name: PI_TURN_TIMEOUT_SECONDS, value: "3600" }
            - { name: PI_PROVIDER, value: anysentry-e2e-gateway }
            - { name: PI_MODEL, value: bailian/deepseek-v4-flash }
            - { name: PI_THINKING, value: "off" }
            - { name: DEEPSEEK_API_KEY_FILE, value: /run/secrets/deepseek_api_key }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: pi-state, mountPath: /home/node/.pi/agent }
            - name: models
              mountPath: /home/node/.pi/agent/models.json
              subPath: models.json
              readOnly: true
            - name: llm-key
              mountPath: /run/secrets/deepseek_api_key
              subPath: deepseek_api_key
              readOnly: true
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            exec:
              command: ["/usr/bin/test", "-f", "/tmp/agent-ready"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/usr/bin/test", "-f", "/tmp/agent-ready"]
            initialDelaySeconds: 25
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 768Mi }
      volumes:
        - name: workspace
          emptyDir: {}
        - name: pi-state
          emptyDir: {}
        - name: models
          configMap:
            name: pi-agent-models
            items:
              - { key: models.json, path: models.json }
        - name: llm-key
          secret:
            secretName: pi-agent-llm
            defaultMode: 0440
            items:
              - { key: deepseek_api_key, path: deepseek_api_key }
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
