map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Docker may assign the API a new address when only that service is recreated.
    # Resolve the service name for every proxy connection instead of retaining the
    # address that happened to exist when nginx started.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $anysentry_api http://anysentry:29653;

    location ~ ^/(security-center|open|api)(/|$) {
        proxy_pass $anysentry_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
