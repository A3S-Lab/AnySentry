# a3s-observer — OBSERVE-ONLY DaemonSet that forwards kernel events into AnySentry.
#   kubectl -n anysentry apply -f deploy/observer.yaml
#
# The collector pipes its NDJSON event stream into the forwarder (scripts/observer-forward.js),
# which POSTs each event to AnySentry's /security-center/ingest seam. No enforce / fileguard
# binaries are run, so this can never block a process — passive tracepoints only.
#
# The image bundles the public a3s-observer with the node forwarder. Build it from this repo
# (see deploy/observer-forwarder.Dockerfile + deploy/README.md) and push to YOUR registry, then set
# the `image:` below to that tag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: anysentry-agent-templates
  namespace: anysentry
data:
  agent-templates.json: |
    {
      "schemaVersion": "anysentry.agent_templates.v1",
      "templates": []
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: a3s-observer
  namespace: anysentry
  labels: { app: a3s-observer }
spec:
  selector:
    matchLabels: { app: a3s-observer }
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 }
  template:
    metadata:
      labels: { app: a3s-observer }
    spec:
      hostPID: true # resolve /proc/<pid> for host-process identity
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 45
      containers:
        - name: a3s-observer
          # Replace with the forwarder image you built + pushed (see deploy/README.md).
          image: ghcr.io/a3s-lab/anysentry-observer:latest
          securityContext:
            privileged: true # eBPF load + tracepoint attach. OBSERVE path only — cannot block.
          env:
            - { name: A3S_OBSERVER_JSON, value: "1" }
            # Full signal set: file writes/deletes (FileAccess/FileDelete) + OpenSSL plaintext
            # (SslContent → prompt-injection / secret-exfil rules + LlmApi model/token usage).
            # Set to "0" to reduce footprint on a busy node.
            - { name: A3S_OBSERVER_FILES, value: "1" }
            - { name: A3S_OBSERVER_SSL, value: "1" }
            # Stable node-scoped Collector identity for the AnySentry Collector and Source consoles.
            - name: A3S_OBSERVER_COLLECTOR_ID
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: A3S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - { name: ANYSENTRY_SOURCE_TYPE, value: "observer" }
            - { name: ANYSENTRY_SOURCE_NAME, value: "kubernetes-a3s-observer" }
            - { name: ANYSENTRY_HEARTBEAT_SECS, value: "30" }
            # Retain unresolved identities for later review, stop reviewed non-Agents, and keep
            # routine pseudo-filesystem noise independent from identity classification.
            - { name: FORWARD_FILTER_MODE, value: "enforce" }
            - { name: FORWARD_RETAIN_UNKNOWN, value: "true" }
            - { name: FORWARD_RETAIN_NON_AGENT, value: "false" }
            - { name: FORWARD_NOISE_POLICY, value: "balanced" }
            - { name: ANYSENTRY_INGEST_URL, value: "http://anysentry:29653/security-center/ingest" }
            - { name: ANYSENTRY_IDENTITY_SNAPSHOT_URL, value: "http://anysentry:29653/security-center/identity/snapshot" }
            - { name: ANYSENTRY_IDENTITY_SNAPSHOT_SECS, value: "15" }
            - { name: ANYSENTRY_AGENT_TEMPLATES_FILE, value: "/etc/anysentry/agent-templates.json" }
            # Bound memory and amortize HTTP/JSON overhead without adding perceptible UI delay.
            - { name: FORWARD_BATCH_SIZE, value: "32" }
            - { name: FORWARD_BATCH_FLUSH_MS, value: "50" }
            # Events are removed only after an item-level durable ack. The hostPath survives
            # container/Pod restarts; when full, stdin is paused instead of dropping evidence.
            - { name: FORWARD_SPOOL_PATH, value: "/var/lib/anysentry-forwarder/spool.wal" }
            - { name: FORWARD_SPOOL_FSYNC, value: "periodic" }
            - { name: FORWARD_SPOOL_FSYNC_MS, value: "250" }
            - { name: FORWARD_SPOOL_MAX_RECORDS, value: "250000" }
            - { name: FORWARD_SPOOL_MAX_BYTES, value: "2147483648" }
          command: ["/bin/sh", "-c"]
          args: ["a3s-observer-collector | node /opt/observer-forward.js"]
          volumeMounts:
            - { name: sys, mountPath: /sys, readOnly: true } # tracepoint ids under /sys
            - { name: agent-templates, mountPath: /etc/anysentry, readOnly: true }
            - { name: forwarder-spool, mountPath: /var/lib/anysentry-forwarder }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            # 1Gi: full signal set (FILES high-volume + SSL uprobes) tracks more state, plus the
            # co-located node forwarder. No CPU limit: a tracer shouldn't be throttled into dropping.
            limits: { memory: 1Gi }
      volumes:
        - { name: sys, hostPath: { path: /sys } }
        - { name: agent-templates, configMap: { name: anysentry-agent-templates } }
        - { name: forwarder-spool, hostPath: { path: /var/lib/anysentry-forwarder, type: DirectoryOrCreate } }
      tolerations:
        - operator: Exists # every node, including tainted/control-plane
