# a3s-observer — OBSERVE-ONLY DaemonSet that forwards kernel events into AnySentry.
#   kubectl -n anysentry apply -f deploy/observer.yaml
#
# The collector pipes its NDJSON event stream into the forwarder (scripts/observer-forward.js),
# which POSTs each event to AnySentry's /security-center/ingest seam. No enforce / fileguard
# binaries are run, so this can never block a process — passive tracepoints only.
#
# The image bundles the public a3s-observer with the node forwarder. Build it from this repo
# (see deploy/observer-forwarder.Dockerfile + deploy/README.md) and push to YOUR registry, then set
# the `image:` below to that tag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: anysentry-agent-templates
  namespace: anysentry
data:
  agent-templates.json: |
    {
      "schemaVersion": "anysentry.agent_templates.v1",
      "templates": []
    }
  agent-runtime-signatures.json: |
    {
      "schemaVersion": "anysentry.agent_runtime_signatures.v1",
      "version": 1,
      "runtimes": [
        { "id": "codex", "displayName": "Codex", "variants": [{ "commExact": ["codex"] }, { "argv0Basename": ["codex"] }] },
        { "id": "a3s-code", "agentScopeId": "a3s code", "displayName": "A3S Code", "variants": [{ "commExact": ["a3s", "a3s-code", "a3s code"] }, { "argv0Basename": ["a3s", "a3s-code"] }, { "argvPrefix": ["a3s code", "a3s-code"] }] },
        { "id": "claude-code", "agentScopeId": "Claude Code", "displayName": "Claude Code", "variants": [{ "commExact": ["claude", "claude-code", "claude code"] }, { "argv0Basename": ["claude", "claude-code"] }] },
        { "id": "gemini-cli", "displayName": "Gemini CLI", "variants": [{ "commExact": ["gemini", "gemini-cli", "gemini cli"] }, { "argv0Basename": ["gemini", "gemini-cli"] }] },
        { "id": "pi", "displayName": "Pi", "variants": [{ "commExact": ["pi"] }, { "argv0Basename": ["pi"] }] },
        { "id": "kimi-cli", "displayName": "Kimi Code CLI", "variants": [{ "commExact": ["Kimi Code", "kimi", "kimi-cli"] }, { "argv0Basename": ["kimi", "kimi-cli"] }] }
      ]
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: a3s-observer
  namespace: anysentry
  labels: { app: a3s-observer, io.anysentry.observe: "false", anysentry.io/workload-role: "anysentry_internal" }
spec:
  selector:
    matchLabels: { app: a3s-observer }
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 }
  template:
    metadata:
      labels: { app: a3s-observer, io.anysentry.observe: "false", anysentry.io/workload-role: "anysentry_internal" }
    spec:
      hostPID: true # resolve /proc/<pid> for host-process identity
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 30
      containers:
        - name: a3s-observer
          # Replace with the forwarder image you built + pushed (see deploy/README.md).
          image: ghcr.io/a3s-lab/anysentry-observer:latest
          securityContext:
            privileged: true # eBPF load + tracepoint attach. OBSERVE path only — cannot block.
          env:
            - { name: A3S_OBSERVER_JSON, value: "1" }
            # Full signal set: file writes/deletes (FileAccess/FileDelete) + OpenSSL plaintext
            # (SslContent → prompt-injection / secret-exfil rules + LlmApi model/token usage).
            # Set to "0" to reduce footprint on a busy node.
            - { name: A3S_OBSERVER_FILES, value: "1" }
            - { name: A3S_OBSERVER_SSL, value: "1" }
            # Stable node-scoped Collector identity for the AnySentry Collector and Source consoles.
            - name: A3S_OBSERVER_COLLECTOR_ID
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: A3S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - { name: ANYSENTRY_SOURCE_TYPE, value: "observer" }
            - { name: ANYSENTRY_SOURCE_NAME, value: "kubernetes-a3s-observer" }
            # Per-node managed Source credentials are generated by deploy/install.sh. One shared
            # read-only Secret contains an exact collectorId -> Source/token mapping; the
            # Forwarder selects only its own node/Collector entry.
            - { name: ANYSENTRY_SOURCE_CREDENTIALS_FILE, value: "/etc/anysentry-auth/observer-sources.json" }
            - name: ANYSENTRY_INFRASTRUCTURE_POLICY_TOKEN
              valueFrom: { secretKeyRef: { name: anysentry-control-auth, key: management-token } }
            - { name: ANYSENTRY_HEARTBEAT_SECS, value: "30" }
            # Retain unresolved identities for later review, stop reviewed non-Agents, and keep
            # routine pseudo-filesystem noise independent from identity classification.
            # Roll out new attribution in shadow first. Switch this to `enforce` only after the
            # real local/Docker/Kubernetes comparison meets the documented acceptance gates.
            - { name: FORWARD_FILTER_MODE, value: "shadow" }
            # The Forwarder owns S3 identity/role/profile production. Keep its rollout explicit so
            # canonical reinstall cannot silently revert Unknown reasons to legacy not_evaluated.
            - { name: ANYSENTRY_UNKNOWN_RETENTION_MODE, value: "shadow" }
            - { name: ANYSENTRY_PROBABLE_PROFILE_TTL_MS, value: "120000" }
            - { name: ANYSENTRY_PROBABLE_PROFILE_MAX_ENTRIES, value: "4096" }
            - { name: FORWARD_RETAIN_UNKNOWN, value: "true" }
            - { name: FORWARD_RETAIN_NON_AGENT, value: "false" }
            - { name: FORWARD_NOISE_POLICY, value: "balanced" }
            # Atomically published decisions feed the Collector's observation-only cgroup map.
            - { name: ANYSENTRY_FILTER_RULES_FILE, value: "/run/anysentry-filter/filter-rules.json" }
            - { name: ANYSENTRY_FILTER_RULES_ACK_FILE, value: "/run/anysentry-filter/filter-rules.ack.json" }
            # The co-located Collector and Forwarder inherit the same rollout mode. Shadow emits
            # desired intent/ACK telemetry while keeping every probe FULL.
            - { name: ANYSENTRY_CAPTURE_PROFILE_MODE, value: "shadow" }
            - { name: ANYSENTRY_CAPTURE_PROFILE_ACK_POLL_MS, value: "250" }
            - { name: ANYSENTRY_INFRASTRUCTURE_POLICY_URL, value: "http://anysentry:29653/security-center/infrastructure-rules/policy" }
            - { name: ANYSENTRY_INFRASTRUCTURE_MATERIALIZATION_URL, value: "http://anysentry:29653/security-center/infrastructure-rules/materializations/report" }
            - { name: ANYSENTRY_INFRASTRUCTURE_POLICY_SECS, value: "5" }
            # Unified F0/F1/F2 projection is authoritative after the first successful load.
            # ConfigMap signatures and the legacy Forwarder env above remain bounded bootstrap/LKG.
            - { name: ANYSENTRY_FILTER_RULE_PROJECTION_URL, value: "http://anysentry:29653/security-center/filter-rules/projections/forwarder" }
            - { name: ANYSENTRY_FILTER_RULE_PROJECTION_SECS, value: "5" }
            - { name: ANYSENTRY_FILTER_RULE_PROJECTION_MAX_BYTES, value: "16777216" }
            - { name: A3S_OBSERVER_FILE_UNKNOWN_PER_CGROUP, value: "20" }
            - { name: A3S_OBSERVER_FILE_UNKNOWN_PER_NODE, value: "200" }
            - { name: A3S_OBSERVER_FILE_SAMPLE_WINDOW_MS, value: "1000" }
            # Remains off in the canonical shadow profile; the explicit file canary enables it.
            - { name: FORWARD_FILE_AGGREGATION, value: "false" }
            - { name: FORWARD_FILE_AGGREGATION_WINDOW_MS, value: "100" }
            - { name: ANYSENTRY_INGEST_URL, value: "http://anysentry:29653/security-center/ingest" }
            - { name: ANYSENTRY_IDENTITY_SNAPSHOT_URL, value: "http://anysentry:29653/security-center/identity/snapshot" }
            - { name: ANYSENTRY_IDENTITY_SNAPSHOT_SECS, value: "15" }
            - { name: FORWARD_IDENTITY_SNAPSHOT_MAX_BYTES, value: "4194304" }
            - { name: ANYSENTRY_AGENT_TEMPLATES_FILE, value: "/etc/anysentry/agent-templates.json" }
            # Low-trust exact process signatures hot-reload to probable_agent only. ConfigMap
            # projection is read-only; operators update it with kubectl, while directory watch plus
            # periodic hash polling handles Kubernetes' atomic `..data` symlink rotation.
            - { name: ANYSENTRY_AGENT_RUNTIME_SIGNATURES_FILE, value: "/etc/anysentry/agent-runtime-signatures.json" }
            - { name: ANYSENTRY_AGENT_RUNTIME_LEASE_URL, value: "http://anysentry:29653/security-center/runtime/lease" }
            - { name: ANYSENTRY_AGENT_RUNTIME_SNAPSHOT_URL, value: "http://anysentry:29653/security-center/runtime/snapshot" }
            - { name: ANYSENTRY_AGENT_RUNTIME_SNAPSHOT_SECS, value: "10" }
            - { name: ANYSENTRY_AGENT_RUNTIME_LIVENESS_SECS, value: "5" }
            # Bound total Forwarder ownership across queued, in-flight, and API-authorized retry
            # states; the retry window plus this budget covers a bounded ClickHouse restart.
            - { name: FORWARD_BATCH_SIZE, value: "32" }
            - { name: FORWARD_BATCH_FLUSH_MS, value: "50" }
            # Four concurrent bounded batches cover measured throughput while leaving the single
            # API event loop responsive to identity/rule/runtime control requests.
            - { name: FORWARD_MAX_INFLIGHT, value: "4" }
            # A deadline is still strict, but an already-arrived response gets one I/O turn before
            # an overdue timer aborts it after a synchronous data-plane burst.
            - { name: FORWARD_CONTROL_HTTP_TIMEOUT_MS, value: "15000" }
            # Events are removed only after an item-level durable ack. The hostPath survives
            # container/Pod restarts; when full, stdin is paused instead of dropping evidence.
            - { name: FORWARD_SPOOL_PATH, value: "/var/lib/anysentry-forwarder/spool.wal" }
            - { name: FORWARD_SPOOL_FSYNC, value: "periodic" }
            - { name: FORWARD_SPOOL_FSYNC_MS, value: "250" }
            - { name: FORWARD_SPOOL_MAX_RECORDS, value: "250000" }
            - { name: FORWARD_SPOOL_MAX_BYTES, value: "2147483648" }
            # A retry deadline parks evidence in the WAL; the same process continuously redrives
            # bounded priority batches, so recovery never depends on a container restart.
            - { name: FORWARD_SPOOL_REPLAY_INTERVAL_MS, value: "500" }
            - { name: FORWARD_SPOOL_REPLAY_BATCH_SIZE, value: "256" }
            - { name: FORWARD_SPOOL_DEGRADED_AGE_MS, value: "60000" }
            - { name: FORWARD_BATCH_MAX_BYTES, value: "524288" }
            - { name: FORWARD_MAX_EVENT_BYTES, value: "3145728" }
            - { name: FORWARD_MAX_OUTSTANDING_EVENTS, value: "16384" }
            - { name: FORWARD_MAX_OUTSTANDING_BYTES, value: "67108864" }
            - { name: FORWARD_PROTECTED_RESERVE_EVENTS, value: "4096" }
            - { name: FORWARD_PROTECTED_RESERVE_BYTES, value: "16777216" }
            - { name: FORWARD_RETRY_BASE_DELAY_MS, value: "250" }
            - { name: FORWARD_RETRY_MAX_DELAY_MS, value: "2000" }
            - { name: FORWARD_RETRY_MAX_AGE_MS, value: "45000" }
            # Forwarder event/control drain < PID 1 child supervision < Kubernetes grace.
            - { name: FORWARD_SHUTDOWN_TIMEOUT_MS, value: "15000" }
            - { name: OBSERVER_SUPERVISOR_SHUTDOWN_TIMEOUT_MS, value: "20000" }
          command: ["/usr/local/bin/node"]
          args: ["/opt/observer-supervisor.js"]
          volumeMounts:
            - { name: sys, mountPath: /sys, readOnly: true } # tracepoint ids under /sys
            - { name: agent-templates, mountPath: /etc/anysentry, readOnly: true }
            - { name: observer-auth, mountPath: /etc/anysentry-auth, readOnly: true }
            - { name: filter-rules, mountPath: /run/anysentry-filter }
            - { name: forwarder-spool, mountPath: /var/lib/anysentry-forwarder }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            # 1Gi: full signal set (FILES high-volume + SSL uprobes) tracks more state, plus the
            # co-located node forwarder. No CPU limit: a tracer shouldn't be throttled into dropping.
            limits: { memory: 1Gi }
      volumes:
        - { name: sys, hostPath: { path: /sys } }
        - { name: agent-templates, configMap: { name: anysentry-agent-templates } }
        - { name: forwarder-spool, hostPath: { path: /var/lib/anysentry-forwarder, type: DirectoryOrCreate } }
        - name: observer-auth
          secret:
            secretName: anysentry-observer-auth
            items:
              - { key: observer-sources.json, path: observer-sources.json, mode: 0400 }
        - { name: filter-rules, emptyDir: {} }
      tolerations:
        - operator: Exists # every node, including tainted/control-plane
