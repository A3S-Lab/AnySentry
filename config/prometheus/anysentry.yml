global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: anysentry

scrape_configs:
  - job_name: anysentry-api
    metrics_path: /security-center/platform/metrics/prometheus
    static_configs:
      - targets: ["anysentry:29653"]
        labels:
          component: anysentry

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: host

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: cadvisor

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: ["clickhouse:9363"]
        labels:
          component: clickhouse

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: prometheus
