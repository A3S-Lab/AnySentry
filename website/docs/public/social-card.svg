  <text x="68" y="205" fill="#a6e9ff" font-family="ui-monospace,monospace" font-size="18" font-weight="700" letter-spacing="2">AI-NATIVE RUNTIME SECURITY + GOVERNANCE</text>

  <text x="68" y="304" fill="#f3f8f7" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="68" font-weight="680" letter-spacing="-3.4">Judge every Agent action</text>
  <text x="68" y="382" fill="url(#accent)" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="68" font-weight="680" letter-spacing="-3.4">inside its system context</text>
  <text x="68" y="439" fill="#9dafb4" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="25">Intent · runtime facts · host state · tiered judgment · preflight control</text>

  <g font-family="ui-monospace,monospace" font-size="16" font-weight="700">
    <rect x="68" y="500" width="226" height="54" rx="10" fill="#17142f" stroke="#8b7cff" stroke-opacity=".48"/>
    <text x="92" y="533" fill="#c6c0ff">04 SECURITY AGENTS</text>
    <rect x="310" y="500" width="220" height="54" rx="10" fill="#0c1e30" stroke="#63d5ff" stroke-opacity=".4"/>
    <text x="334" y="533" fill="#a6e9ff">03 RISK DOMAINS</text>
    <rect x="546" y="500" width="258" height="54" rx="10" fill="#171a20" stroke="#f4ca68" stroke-opacity=".34"/>
    <text x="570" y="533" fill="#f4ca68">02 GOVERNANCE PATHS</text>
  </g>
  <path d="M902 90v452" stroke="#86aec1" stroke-opacity=".15"/>
  <path d="M942 161h190M942 215h132M942 269h164M942 323h112M942 377h146" stroke="#b2aaff" stroke-opacity=".3" stroke-width="2"/>
