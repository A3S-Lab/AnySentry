<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AnySentry</title>
  <desc id="desc">Runtime evidence, risk decisions, and governed actions for AI agents.</desc>
  <defs>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#0b0f12" stop-opacity="0"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity=".13"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" rx="30" fill="#080b0d"/>
  <rect width="1200" height="630" rx="30" fill="url(#grid)"/>
