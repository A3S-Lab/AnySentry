  <text x="70" y="250" fill="#f4f8f7" font-family="Inter,Arial,sans-serif" font-size="70" font-weight="730" letter-spacing="-3">Evidence before action.</text>
  <text x="70" y="320" fill="#92a09b" font-family="Inter,Arial,sans-serif" font-size="31">Observe what agents actually do. Judge risk.</text>
  <text x="70" y="363" fill="#92a09b" font-family="Inter,Arial,sans-serif" font-size="31">Turn every decision into an auditable action.</text>
  <g font-family="ui-monospace,monospace" font-size="18" font-weight="650">
