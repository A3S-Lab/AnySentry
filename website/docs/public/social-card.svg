<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AnySentry</title>
  <desc id="desc">AI-Native runtime security and governance grounded in system context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#05090e"/>
      <stop offset=".62" stop-color="#07131d"/>
      <stop offset="1" stop-color="#0a1c2c"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="0" cy="0" r="1" gradientTransform="translate(165 135) rotate(44) scale(510 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b7cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(1045 514) rotate(-139) scale(520 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63d5ff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#63d5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#b2aaff"/>
      <stop offset="1" stop-color="#63d5ff"/>
    </linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#a6d2e6" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="30" fill="url(#grid)"/>
  <rect width="1200" height="630" rx="30" fill="url(#tealGlow)"/>
  <rect width="1200" height="630" rx="30" fill="url(#blueGlow)"/>
  <rect x="1" y="1" width="1198" height="628" rx="29" fill="none" stroke="#86aec1" stroke-opacity=".25" stroke-width="2"/>

  <g transform="translate(68 58) scale(.58)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M98 29 90 21H38L19 40v48l19 19h52l8-8" stroke="#E8E6FF" stroke-opacity=".9" stroke-width="10"/>
    <path d="M87 42 80 35H46L33 48v32l13 13h34l7-7" stroke="#B2AAFF" stroke-width="9"/>
