# AnySentry standalone deployment: dashboard, asynchronous tiered judgment, Redis, and ClickHouse.
#
#   docker compose up -d --build
#
# Feed real events by piping an a3s-observer collector into scripts/observer-forward.js.
x-anysentry-infrastructure-labels: &anysentry-infrastructure-labels
  io.anysentry.observe: "false"
  anysentry.io/workload-role: "anysentry_internal"

services:
  prometheus:
    image: prom/prometheus:v3.12.0
    labels: *anysentry-infrastructure-labels
    mem_limit: 768m
    mem_reservation: 128m
    command:
      - --config.file=/etc/prometheus/anysentry.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus/anysentry.yml:/etc/prometheus/anysentry.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    labels: *anysentry-infrastructure-labels
    mem_limit: 128m
    mem_reservation: 32m
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.2
    labels: *anysentry-infrastructure-labels
    mem_limit: 512m
    mem_reservation: 128m
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --global_housekeeping_interval=1m
      - --store_container_labels=true
      - --enable_metrics=cpu,memory,oom_event
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    labels: *anysentry-infrastructure-labels
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-anysentry}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-anysentry}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-anysentry}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/clickhouse/anysentry-server.xml:/etc/clickhouse-server/config.d/10-anysentry-server.xml:ro
      - ./deploy/clickhouse-memory.xml:/etc/clickhouse-server/config.d/20-anysentry-memory.xml:ro
      - ./config/clickhouse/anysentry-users.xml:/etc/clickhouse-server/users.d/10-anysentry-users.xml:ro
    mem_limit: 4g
    memswap_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
    stop_grace_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    labels: *anysentry-infrastructure-labels
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    labels: *anysentry-infrastructure-labels
    environment:
      POSTGRES_DB: ${ANYSENTRY_POSTGRES_DB:-anysentry}
      POSTGRES_USER: ${ANYSENTRY_POSTGRES_USER:-anysentry}
      POSTGRES_PASSWORD: ${ANYSENTRY_POSTGRES_PASSWORD:-anysentry}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

  anysentry:
    build: .
    image: ghcr.io/a3s-lab/anysentry:latest
    labels: *anysentry-infrastructure-labels
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      PORT: 29653
      NODE_OPTIONS: ${ANYSENTRY_API_NODE_OPTIONS:---max-old-space-size=1024}
      ANYSENTRY_HOT_EVENT_LIMIT: ${ANYSENTRY_HOT_EVENT_LIMIT:-5000}
      ANYSENTRY_OBSERVER_BODY_LIMIT: ${ANYSENTRY_OBSERVER_BODY_LIMIT:-4mb}
      ANYSENTRY_MANAGEMENT_TOKEN: ${ANYSENTRY_MANAGEMENT_TOKEN:-}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-anysentry}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-anysentry}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-anysentry}
      ANYSENTRY_CLICKHOUSE_MICROBATCH: ${ANYSENTRY_CLICKHOUSE_MICROBATCH:-off}
      ANYSENTRY_CLICKHOUSE_BATCH_MAX_ROWS: ${ANYSENTRY_CLICKHOUSE_BATCH_MAX_ROWS:-1000}
      ANYSENTRY_CLICKHOUSE_BATCH_MAX_DELAY_MS: ${ANYSENTRY_CLICKHOUSE_BATCH_MAX_DELAY_MS:-1000}
      ANYSENTRY_CLICKHOUSE_BATCH_MAX_BYTES: ${ANYSENTRY_CLICKHOUSE_BATCH_MAX_BYTES:-1048576}
      ANYSENTRY_OBSERVER_BATCH_CONCURRENCY: ${ANYSENTRY_OBSERVER_BATCH_CONCURRENCY:-24}
      ANYSENTRY_CLICKHOUSE_MAX_QUEUED_ROWS: ${ANYSENTRY_CLICKHOUSE_MAX_QUEUED_ROWS:-20000}
      ANYSENTRY_CLICKHOUSE_MAX_QUEUED_BYTES: ${ANYSENTRY_CLICKHOUSE_MAX_QUEUED_BYTES:-67108864}
      ANYSENTRY_CLICKHOUSE_SHUTDOWN_FLUSH_MS: ${ANYSENTRY_CLICKHOUSE_SHUTDOWN_FLUSH_MS:-10000}
      ANYSENTRY_REVISION_IMMUTABILITY: ${ANYSENTRY_REVISION_IMMUTABILITY:-audit}
      ANYSENTRY_ASYNC_JUDGE: "on"
      ANYSENTRY_REDIS_URL: redis://redis:6379/0
      ANYSENTRY_DATABASE_URL: ${ANYSENTRY_DATABASE_URL:-postgresql://${ANYSENTRY_POSTGRES_USER:-anysentry}:${ANYSENTRY_POSTGRES_PASSWORD:-anysentry}@postgres:5432/${ANYSENTRY_POSTGRES_DB:-anysentry}}
      ANYSENTRY_PROMETHEUS_URL: ${ANYSENTRY_PROMETHEUS_URL:-http://prometheus:9090}
      ANYSENTRY_METRICS_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-anysentry}
      ANYSENTRY_SUPPLY_CHAIN: ${ANYSENTRY_SUPPLY_CHAIN:-off}
      ANYSENTRY_SUPPLY_CHAIN_RUNTIME: ${ANYSENTRY_SUPPLY_CHAIN_RUNTIME:-off}
      ANYSENTRY_WORKSPACE_SCANNER_TOKEN: ${ANYSENTRY_WORKSPACE_SCANNER_TOKEN:-}
      ANYSENTRY_WORKSPACE_SCANNER_TOKENS: ${ANYSENTRY_WORKSPACE_SCANNER_TOKENS:-}
      ANYSENTRY_RUNTIME_INSTALL_DEBOUNCE_MS: ${ANYSENTRY_RUNTIME_INSTALL_DEBOUNCE_MS:-10000}
      ANYSENTRY_STREAMING: ${ANYSENTRY_STREAMING:-off}
      ANYSENTRY_STREAM_AGENT_ONLY: ${ANYSENTRY_STREAM_AGENT_ONLY:-on}
      ANYSENTRY_STREAM_BOOTSTRAP_SERVERS: ${ANYSENTRY_STREAM_BOOTSTRAP_SERVERS:-kafka:9092}
      ANYSENTRY_STREAM_CANONICAL_TOPIC: ${ANYSENTRY_STREAM_CANONICAL_TOPIC:-anysentry.events.canonical.v1}
      ANYSENTRY_STREAM_JUDGMENTS_TOPIC: ${ANYSENTRY_STREAM_JUDGMENTS_TOPIC:-anysentry.judgments.v1}
      ANYSENTRY_STREAM_EPISODES_TOPIC: ${ANYSENTRY_STREAM_EPISODES_TOPIC:-anysentry.risk-analysis-batches.v1}
      ANYSENTRY_STREAM_FINDINGS_TOPIC: ${ANYSENTRY_STREAM_FINDINGS_TOPIC:-anysentry.stream.findings.v1}
      ANYSENTRY_STREAM_DLQ_TOPIC: ${ANYSENTRY_STREAM_DLQ_TOPIC:-anysentry.stream.dlq.v1}
      ANYSENTRY_FLINK_REST_URL: ${ANYSENTRY_FLINK_REST_URL:-http://flink-jobmanager:8081}
      ANYSENTRY_FLINK_JOB_NAME: ${ANYSENTRY_FLINK_JOB_NAME:-AnySentry Flink Shadow Risk}
      ANYSENTRY_ASSISTANT: ${ANYSENTRY_ASSISTANT:-on}
      ANYSENTRY_ASSISTANT_CONCURRENCY: ${ANYSENTRY_ASSISTANT_CONCURRENCY:-2}
      ANYSENTRY_ASSISTANT_TIMEOUT_MS: ${ANYSENTRY_ASSISTANT_TIMEOUT_MS:-90000}
      ANYSENTRY_ASSISTANT_CONTEXT_TOKENS: ${ANYSENTRY_ASSISTANT_CONTEXT_TOKENS:-32768}
      A3S_SENTRY_ASSISTANT_URL: ${A3S_SENTRY_ASSISTANT_URL:-http://host.docker.internal:18051/v1}
      A3S_SENTRY_ASSISTANT_MODEL: ${A3S_SENTRY_ASSISTANT_MODEL:-minimax-m2.7}
      A3S_SENTRY_ASSISTANT_KEY: ${A3S_SENTRY_ASSISTANT_KEY:-proxy-managed}
      A3S_SENTRY_LLM_URL: ${A3S_SENTRY_LLM_URL:-http://host.docker.internal:18051/v1}
      A3S_SENTRY_LLM_MODEL: ${A3S_SENTRY_LLM_MODEL:-glm-5.2}
      A3S_SENTRY_LLM_KEY: ${A3S_SENTRY_LLM_KEY:-}
      A3S_SENTRY_L3_URL: ${A3S_SENTRY_L3_URL:-http://host.docker.internal:18051/v1}
      A3S_SENTRY_L3_MODEL: ${A3S_SENTRY_L3_MODEL:-glm-5.2}
      A3S_SENTRY_L3_KEY: ${A3S_SENTRY_L3_KEY:-}
      ANYSENTRY_L2_CONTEXT_TOKENS: ${ANYSENTRY_L2_CONTEXT_TOKENS:-16384}
      ANYSENTRY_L3_TIMEOUT_MS: ${ANYSENTRY_L3_TIMEOUT_MS:-180000}
      ANYSENTRY_L3_CONTEXT_TOKENS: ${ANYSENTRY_L3_CONTEXT_TOKENS:-32768}
      ANYSENTRY_IDENTITY_REVIEW_TIMEOUT_MS: ${ANYSENTRY_IDENTITY_REVIEW_TIMEOUT_MS:-45000}
      # ANYSENTRY_SYNTHETIC_FEED: "on"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "29653:29653"
    stop_grace_period: 30s
    restart: unless-stopped

  fast-judge:
    image: ghcr.io/a3s-lab/anysentry:latest
    labels: *anysentry-infrastructure-labels
    depends_on:
      redis:
        condition: service_healthy
    command: ["node", "dist/security-monitoring/worker-main.js"]
    environment:
      ANYSENTRY_WORKER_ROLE: fast
      ANYSENTRY_REDIS_URL: redis://redis:6379/0
      ANYSENTRY_FAST_JUDGE_CONCURRENCY: 4
      ANYSENTRY_L2_MODEL: ${ANYSENTRY_L2_MODEL:-glm-5.2}
      ANYSENTRY_L2_CONTEXT_TOKENS: ${ANYSENTRY_L2_CONTEXT_TOKENS:-16384}
      A3S_SENTRY_LLM_URL: ${A3S_SENTRY_LLM_URL:-http://host.docker.internal:18051/v1}
      A3S_SENTRY_LLM_MODEL: ${A3S_SENTRY_LLM_MODEL:-glm-5.2}
      A3S_SENTRY_LLM_KEY: ${A3S_SENTRY_LLM_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  l3-worker:
    image: ghcr.io/a3s-lab/anysentry:latest
    labels: *anysentry-infrastructure-labels
    depends_on:
      redis:
        condition: service_healthy
    command: ["node", "dist/security-monitoring/worker-main.js"]
    environment:
      ANYSENTRY_WORKER_ROLE: l3
      ANYSENTRY_REDIS_URL: redis://redis:6379/0
      ANYSENTRY_L3_CONCURRENCY: 2
      ANYSENTRY_L3_TIMEOUT_MS: 180000
      ANYSENTRY_L3_RETRY_TIMEOUT_MS: 180000
      ANYSENTRY_L3_ATTEMPTS: 2
      ANYSENTRY_L3_CONTEXT_TOKENS: 32768
      ANYSENTRY_L3_SKILLS: /opt/anysentry/skills
      A3S_SENTRY_LLM_URL: ${A3S_SENTRY_LLM_URL:-http://host.docker.internal:18051/v1}
      A3S_SENTRY_LLM_MODEL: ${A3S_SENTRY_LLM_MODEL:-glm-5.2}
      A3S_SENTRY_LLM_KEY: ${A3S_SENTRY_LLM_KEY:-}
      A3S_SENTRY_L3_URL: ${A3S_SENTRY_L3_URL:-http://host.docker.internal:18051/v1}
      A3S_SENTRY_L3_MODEL: ${A3S_SENTRY_L3_MODEL:-glm-5.2}
      A3S_SENTRY_L3_KEY: ${A3S_SENTRY_L3_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  kafka:
    profiles: ["streaming"]
    image: apache/kafka:4.1.1
    labels: *anysentry-infrastructure-labels
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 2
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  kafka-init:
    profiles: ["streaming"]
    image: apache/kafka:4.1.1
    labels: *anysentry-infrastructure-labels
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in \
          "${ANYSENTRY_STREAM_CANONICAL_TOPIC:-anysentry.events.canonical.v1}" \
          "${ANYSENTRY_STREAM_JUDGMENTS_TOPIC:-anysentry.judgments.v1}" \
          "${ANYSENTRY_STREAM_EPISODES_TOPIC:-anysentry.risk-analysis-batches.v1}" \
          "${ANYSENTRY_STREAM_FINDINGS_TOPIC:-anysentry.stream.findings.v1}" \
          "${ANYSENTRY_SUPPLY_CHAIN_CONTEXT_TOPIC:-anysentry.supply-chain.context.v1}" \
          "${ANYSENTRY_STREAM_DLQ_TOPIC:-anysentry.stream.dlq.v1}"; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions 2 \
            --replication-factor 1
        done

  flink-checkpoint-init:
    profiles: ["streaming"]
    build: ./streaming/flink
    image: anysentry-flink-streaming:local
    labels: *anysentry-infrastructure-labels
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R flink:flink /opt/flink/checkpoints"]
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints

  flink-jobmanager:
    profiles: ["streaming"]
    build: ./streaming/flink
    image: anysentry-flink-streaming:local
    labels: *anysentry-infrastructure-labels
    depends_on:
      flink-checkpoint-init:
        condition: service_completed_successfully
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    ports:
      - "8081:8081"
    restart: unless-stopped

  flink-taskmanager:
    profiles: ["streaming"]
    build: ./streaming/flink
    image: anysentry-flink-streaming:local
    labels: *anysentry-infrastructure-labels
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    restart: unless-stopped

  flink-job-submit:
    profiles: ["streaming"]
    build: ./streaming/flink
    image: anysentry-flink-streaming:local
    labels: *anysentry-infrastructure-labels
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        until flink list -m flink-jobmanager:8081 >/dev/null 2>&1; do sleep 2; done
        while true; do
          if flink list -m flink-jobmanager:8081 2>/dev/null \
            | grep -Fq "AnySentry Flink Shadow Risk (RUNNING)"; then
            sleep 15
            continue
          fi
          echo "AnySentry Flink job is absent; submitting it"
          flink run -d \
            -m flink-jobmanager:8081 \
            -c org.a3s.anysentry.streaming.AnySentryStreamJob \
            /opt/flink/usrlib/anysentry-flink-streaming.jar || true
          sleep 15
        done
    restart: unless-stopped
    environment:
      ANYSENTRY_STREAM_BOOTSTRAP_SERVERS: kafka:9092
      ANYSENTRY_STREAM_CANONICAL_TOPIC: ${ANYSENTRY_STREAM_CANONICAL_TOPIC:-anysentry.events.canonical.v1}
      ANYSENTRY_STREAM_JUDGMENTS_TOPIC: ${ANYSENTRY_STREAM_JUDGMENTS_TOPIC:-anysentry.judgments.v1}
      ANYSENTRY_STREAM_EPISODES_TOPIC: ${ANYSENTRY_STREAM_EPISODES_TOPIC:-anysentry.risk-analysis-batches.v1}
      ANYSENTRY_STREAM_FINDINGS_TOPIC: ${ANYSENTRY_STREAM_FINDINGS_TOPIC:-anysentry.stream.findings.v1}
      ANYSENTRY_STREAM_DLQ_TOPIC: ${ANYSENTRY_STREAM_DLQ_TOPIC:-anysentry.stream.dlq.v1}
      ANYSENTRY_SUPPLY_CHAIN_CONTEXT_TOPIC: ${ANYSENTRY_SUPPLY_CHAIN_CONTEXT_TOPIC:-anysentry.supply-chain.context.v1}
      ANYSENTRY_FLINK_CANONICAL_GROUP: ${ANYSENTRY_FLINK_CANONICAL_GROUP:-anysentry-flink-shadow-v2}
      ANYSENTRY_FLINK_JUDGMENTS_GROUP: ${ANYSENTRY_FLINK_JUDGMENTS_GROUP:-anysentry-flink-judgments-v2}
      ANYSENTRY_FLINK_SUPPLY_CHAIN_CONTEXT_GROUP: ${ANYSENTRY_FLINK_SUPPLY_CHAIN_CONTEXT_GROUP:-anysentry-flink-supply-chain-context-v1}
      ANYSENTRY_FLINK_STARTUP_MODE: ${ANYSENTRY_FLINK_STARTUP_MODE:-latest}
      ANYSENTRY_FLINK_PARALLELISM: ${ANYSENTRY_FLINK_PARALLELISM:-2}
      ANYSENTRY_FLINK_LEGACY_COMPOSITE_ENABLED: ${ANYSENTRY_FLINK_LEGACY_COMPOSITE_ENABLED:-off}

  stream-worker:
    profiles: ["streaming"]
    image: ghcr.io/a3s-lab/anysentry:latest
    labels: *anysentry-infrastructure-labels
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    command: ["node", "dist/security-monitoring/stream-worker-main.js"]
    environment:
      ANYSENTRY_STREAM_WORKER_ROLE: all
      ANYSENTRY_REDIS_URL: redis://redis:6379/0
      ANYSENTRY_STREAM_BOOTSTRAP_SERVERS: kafka:9092
      ANYSENTRY_STREAM_EPISODES_TOPIC: ${ANYSENTRY_STREAM_EPISODES_TOPIC:-anysentry.risk-analysis-batches.v1}
      ANYSENTRY_STREAM_FINDINGS_TOPIC: ${ANYSENTRY_STREAM_FINDINGS_TOPIC:-anysentry.stream.findings.v1}
      ANYSENTRY_STREAM_CONSUMER_GROUP: ${ANYSENTRY_STREAM_CONSUMER_GROUP:-anysentry-stream-findings}
      ANYSENTRY_STREAM_EPISODE_CONSUMER_GROUP: ${ANYSENTRY_STREAM_EPISODE_CONSUMER_GROUP:-anysentry-stream-episodes}
      ANYSENTRY_LEGACY_COMPOSITE_ENABLED: ${ANYSENTRY_LEGACY_COMPOSITE_ENABLED:-off}
      ANYSENTRY_COMPOSITE_MAX_EVENT_AGE_MS: ${ANYSENTRY_COMPOSITE_MAX_EVENT_AGE_MS:-900000}
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-anysentry}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-anysentry}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-anysentry}
    restart: unless-stopped

  composite-judge:
    profiles: ["streaming"]
    image: ghcr.io/a3s-lab/anysentry:latest
    labels: *anysentry-infrastructure-labels
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/security-monitoring/stream-worker-main.js"]
    environment:
      ANYSENTRY_STREAM_WORKER_ROLE: judge
      ANYSENTRY_REDIS_URL: redis://redis:6379/0
      ANYSENTRY_COMPOSITE_LLM_URL: ${ANYSENTRY_COMPOSITE_LLM_URL:-}
      ANYSENTRY_COMPOSITE_LLM_KEY: ${ANYSENTRY_COMPOSITE_LLM_KEY:-}
      # Empty means: follow the Deep Investigation runtime model/Secret; the worker keeps the
      # historical glm fallback only when neither runtime nor A3S model configuration exists.
      ANYSENTRY_COMPOSITE_MODEL: ${ANYSENTRY_COMPOSITE_MODEL:-}
      ANYSENTRY_COMPOSITE_TIMEOUT_MS: ${ANYSENTRY_COMPOSITE_TIMEOUT_MS:-60000}
      ANYSENTRY_COMPOSITE_CONCURRENCY: ${ANYSENTRY_COMPOSITE_CONCURRENCY:-2}
      ANYSENTRY_COMPOSITE_MAX_EVENT_AGE_MS: ${ANYSENTRY_COMPOSITE_MAX_EVENT_AGE_MS:-900000}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-anysentry}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-anysentry}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-anysentry}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  supply-chain-assessment:
    image: ghcr.io/a3s-lab/anysentry:latest
    labels: *anysentry-infrastructure-labels
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/security-monitoring/supply-chain-worker-main.js"]
    environment:
      ANYSENTRY_REDIS_URL: redis://redis:6379/0
      ANYSENTRY_OSV_API_URL: ${ANYSENTRY_OSV_API_URL:-https://api.osv.dev}
      ANYSENTRY_OSV_INTELLIGENCE_MODE: ${ANYSENTRY_OSV_INTELLIGENCE_MODE:-online}
      ANYSENTRY_OSV_DATA_REVISION: ${ANYSENTRY_OSV_DATA_REVISION:-}
      ANYSENTRY_OSV_REQUEST_TIMEOUT_MS: ${ANYSENTRY_OSV_REQUEST_TIMEOUT_MS:-20000}
      ANYSENTRY_OSV_REFRESH_INTERVAL_MS: ${ANYSENTRY_OSV_REFRESH_INTERVAL_MS:-86400000}
      ANYSENTRY_SUPPLY_CHAIN_ASSESSMENT_CONCURRENCY: ${ANYSENTRY_SUPPLY_CHAIN_ASSESSMENT_CONCURRENCY:-2}
      ANYSENTRY_SUPPLY_CHAIN_RUNTIME: ${ANYSENTRY_SUPPLY_CHAIN_RUNTIME:-off}
      ANYSENTRY_STREAM_BOOTSTRAP_SERVERS: kafka:9092
      ANYSENTRY_SUPPLY_CHAIN_CONTEXT_TOPIC: ${ANYSENTRY_SUPPLY_CHAIN_CONTEXT_TOPIC:-anysentry.supply-chain.context.v1}
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-anysentry}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-anysentry}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-anysentry}
    restart: unless-stopped

volumes:
  prometheus-data:
  clickhouse-data:
  redis-data:
  postgres-data:
  kafka-data:
  flink-checkpoints:
